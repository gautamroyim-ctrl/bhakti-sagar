
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhakti Sagar Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f2ea;color:#30251b}
header{background:#6d3218;color:#fff;padding:20px}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#f5d8b0}
.container{max-width:1100px;margin:auto;padding:22px}
.card{background:#fff;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 10px #0000000c}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0 14px;font-size:15px}
textarea{min-height:100px;resize:vertical}
button{background:#8a4a20;color:white;border:0;padding:11px 16px;border-radius:8px;cursor:pointer;margin:4px}
button:hover{opacity:.88}
.secondary{background:#777}
.danger{background:#b43a32}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:#fff;padding:18px;border-radius:12px;flex:1;min-width:140px}
.stat h2{margin:0;color:#a45b22}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;vertical-align:top}
th{background:#faf7f2}
.actions{white-space:nowrap}
#adminArea{display:none}
#message{margin:12px 0;font-weight:bold}
.hidden{display:none}
@media(max-width:650px){.container{padding:12px}table{font-size:13px}.actions{white-space:normal}}
</style>
</head>
<body>
<header>
<h1>🪷 Bhakti Sagar Admin Panel</h1>
<p>Manage Ram & Krishna devotional content</p>
</header>

<div class="container">

<div class="card" id="loginArea">
<h2>Admin Login</h2>
<p>Login with your admin email and password.</p>
<label>Email</label>
<input id="email" type="email" placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="loginMsg"></div>
</div>

<div id="adminArea">
<div class="stats">
<div class="stat"><p>Total Content</p><h2 id="totalCount">0</h2></div>
<div class="stat"><p>Published</p><h2 id="publishedCount">0</h2></div>
<div class="stat"><p>Drafts</p><h2 id="draftCount">0</h2></div>
</div>

<div class="card">
<h2 id="formTitle">Add New Content</h2>
<input type="hidden" id="editId">

<label>Content Type</label>
<select id="content_type">
<option value="bhajan">Bhajan</option>
<option value="gita_shlok">Gita Shlok</option>
<option value="aarti">Aarti</option>
<option value="quote">Daily Quote</option>
</select>

<label>Category (Ram / Krishna / Geeta / Ramayan etc.)</label>
<input id="category" placeholder="e.g. Krishna">

<label>Title</label>
<input id="title" placeholder="Content title">

<label>Sanskrit</label>
<textarea id="sanskrit" placeholder="Sanskrit content"></textarea>

<label>Hindi</label>
<textarea id="hindi" placeholder="Hindi content"></textarea>

<label>English</label>
<textarea id="english" placeholder="English content"></textarea>

<label>Hinglish</label>
<textarea id="hinglish" placeholder="Hinglish content"></textarea>

<label>Explanation / Meaning</label>
<textarea id="explanation" placeholder="Meaning or explanation"></textarea>

<label>Media URL (optional)</label>
<input id="media_url" placeholder="Audio or image URL">

<label>Publish Date</label>
<input id="publish_date" type="date">

<label>Status</label>
<select id="status">
<option value="draft">Draft</option>
<option value="published">Published</option>
</select>

<button onclick="saveContent()">Save Content</button>
<button class="secondary" onclick="resetForm()">Clear Form</button>
<div id="saveMsg"></div>
</div>

<div class="card">
<h2>Manage Content</h2>
<label>Filter Content</label>
<select id="filterType" onchange="loadContent()">
<option value="">All Content</option>
<option value="bhajan">Bhajan</option>
<option value="gita_shlok">Gita Shlok</option>
<option value="aarti">Aarti</option>
<option value="quote">Daily Quote</option>
</select>
<button class="secondary" onclick="loadContent()">Refresh</button>
<button class="danger" onclick="logout()">Logout</button>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Title</th><th>Type</th><th>Category</th><th>Status</th><th>Actions</th>
</tr>
</thead>
<tbody id="contentList"></tbody>
</table>
</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://oibpfwbuzjbumgwvhoqb.supabase.co";
const SUPABASE_KEY = "sb_publishable_wlC6YV3wl9v_gPvVmZSNPA_YcZQuDVa";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let contents = [];

async function checkSession(){
  const {data:{session}} = await db.auth.getSession();
  if(session) showAdmin();
}
checkSession();

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("loginMsg");
  msg.textContent="Logging in...";
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){msg.textContent=error.message;return;}
  showAdmin();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

function showAdmin(){
  document.getElementById("loginArea").style.display="none";
  document.getElementById("adminArea").style.display="block";
  loadContent();
}

async function loadContent(){
  const type=document.getElementById("filterType").value;
  let query=db.from("devotional_content").select("*").order("created_at",{ascending:false});
  if(type) query=query.eq("content_type",type);
  const {data,error}=await query;
  if(error){
    document.getElementById("saveMsg").textContent="Load error: "+error.message;
    return;
  }
  contents=data||[];
  renderContent();
  updateStats();
}

function updateStats(){
  document.getElementById("totalCount").textContent=contents.length;
  document.getElementById("publishedCount").textContent=contents.filter(x=>x.status==="published").length;
  document.getElementById("draftCount").textContent=contents.filter(x=>x.status!=="published").length;
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderContent(){
  const tbody=document.getElementById("contentList");
  tbody.innerHTML=contents.map(c=>`
    <tr>
      <td>${esc(c.title)}</td>
      <td>${esc(c.content_type)}</td>
      <td>${esc(c.category)}</td>
      <td>${esc(c.status)}</td>
      <td class="actions">
        <button onclick="editContent('${c.id}')">Edit</button>
        <button class="danger" onclick="deleteContent('${c.id}')">Delete</button>
      </td>
    </tr>
  `).join("");
}

async function saveContent(){
  const id=document.getElementById("editId").value;
  const payload={
    content_type:document.getElementById("content_type").value,
    category:document.getElementById("category").value.trim(),
    title:document.getElementById("title").value.trim(),
    sanskrit:document.getElementById("sanskrit").value,
    hindi:document.getElementById("hindi").value,
    english:document.getElementById("english").value,
    hinglish:document.getElementById("hinglish").value,
    explanation:document.getElementById("explanation").value,
    media_url:document.getElementById("media_url").value.trim(),
    publish_date:document.getElementById("publish_date").value||null,
    status:document.getElementById("status").value,
    updated_at:new Date().toISOString()
  };

  if(!payload.title){
    document.getElementById("saveMsg").textContent="Please enter a title.";
    return;
  }

  document.getElementById("saveMsg").textContent="Saving...";

  let result;
  if(id){
    result=await db.from("devotional_content").update(payload).eq("id",id);
  }else{
    result=await db.from("devotional_content").insert(payload);
  }

  if(result.error){
    document.getElementById("saveMsg").textContent="Error: "+result.error.message;
    return;
  }

  document.getElementById("saveMsg").textContent="Saved successfully!";
  resetForm();
  loadContent();
}

function editContent(id){
  const c=contents.find(x=>x.id===id);
  if(!c)return;
  document.getElementById("editId").value=c.id;
  document.getElementById("content_type").value=c.content_type||"bhajan";
  document.getElementById("category").value=c.category||"";
  document.getElementById("title").value=c.title||"";
  document.getElementById("sanskrit").value=c.sanskrit||"";
  document.getElementById("hindi").value=c.hindi||"";
  document.getElementById("english").value=c.english||"";
  document.getElementById("hinglish").value=c.hinglish||"";
  document.getElementById("explanation").value=c.explanation||"";
  document.getElementById("media_url").value=c.media_url||"";
  document.getElementById("publish_date").value=c.publish_date||"";
  document.getElementById("status").value=c.status||"draft";
  document.getElementById("formTitle").textContent="Edit Content";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteContent(id){
  if(!confirm("Are you sure you want to delete this content?"))return;
  const {error}=await db.from("devotional_content").delete().eq("id",id);
  if(error){alert("Delete error: "+error.message);return;}
  loadContent();
}

function resetForm(){
  document.getElementById("editId").value="";
  ["category","title","sanskrit","hindi","english","hinglish","explanation","media_url","publish_date"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("content_type").value="Bhajan";
  document.getElementById("status").value="draft";
  document.getElementById("formTitle").textContent="Add New Content";
}
</script>
</body>
</html>
